<text x="40" y="760" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#243347">OPEN: Pi power entry; USB power coexistence; sensor supply levels and physical connector views.</text>
<text x="40" y="781" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#243347">A02YYUW is not connected to HC-SR04 trigger/echo pins. Candidate replacement remains unselected.</text>
<text x="40" y="802" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#243347">Camera path, OLED, encoders, PCA9685, GPS/RTK, LiDAR and motion-control interfaces: future / unresolved.</text>
<text x="40" y="823" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#243347">MPU-6050 has no magnetometer. No absolute yaw, odometry or obstacle-avoidance capability is established.</text>
<text x="40" y="844" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#243347">Sources: S04 BOM; S06 research report; owner Uno confirmation; REC-001..038 discrepancy register.</text>
<text x="40" y="975" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#243347">DRAFT R1 | 2026-11-21 | Dashed links = unresolved/proposed, not an instruction to wire | Technical review pending</text>
