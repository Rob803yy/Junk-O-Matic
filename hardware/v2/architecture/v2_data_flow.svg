<text x="40" y="560" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#243347">New contract: JSON protocol 2, proposed 10Hz records; drivers default OFF.</text>
<text x="40" y="581" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#243347">S06 CSV D/H protocol and 20Hz IMU + 1Hz status remain source proposals.</text>
