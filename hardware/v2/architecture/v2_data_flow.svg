<text x="40" y="644" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#243347">Raw MPU-6050 data does not provide validated absolute heading.</text>
<text x="40" y="665" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#243347">No RC commands, motion watchdog, GPS, sorting or autonomous navigation.</text>
<text x="40" y="686" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#243347">Optional camera capture is separate; no synchronization accuracy claim.</text>
<text x="40" y="975" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#243347">DRAFT R1 | 2026-11-21 | Dashed links = unresolved/proposed, not an instruction to wire | Technical review pending</text>
