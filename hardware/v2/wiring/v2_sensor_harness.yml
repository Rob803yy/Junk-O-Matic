metadata:
  title: v2_sensor_harness / DRAFT R1 - NOT AS BUILT
  revision: R1
  notes: All links proposed or untraced. Physical details TBD. U5A separate 5V 3A
    routing OPEN. RANGE1 historical HC-SR04 reported lost; replacement not selected.
    A02YYUW UART is not a trigger/echo substitute.
